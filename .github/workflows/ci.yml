name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DSIGIL_ENABLE_GCCJIT=OFF -DSIGIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke check example
        run: ./build/sigil check examples/cache.sigil --no-z3 --dump-smt

  solver:
    name: Z3 strict proof smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Configure
        run: cmake -S . -B build -DSIGIL_ENABLE_GCCJIT=OFF -DSIGIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Strict proof smoke
        run: |
          ./build/sigil check examples/cache.sigil --strict
          ./build/sigil check examples/locals.sigil --strict

      - name: Refutation smoke
        run: |
          set +e
          output="$(./build/sigil check examples/refuted.sigil --strict --show-model 2>&1)"
          status="$?"
          set -e
          echo "$output"
          test "$status" -eq 2
          grep "\\[REFUTED\\]" <<<"$output"
          grep "model:" <<<"$output"

      - name: SMT artifact smoke
        run: |
          ./build/sigil check examples/cache.sigil --strict --save-smt build/smt
          test -f build/smt/fn.preserve_capacity.ensures.1.still_bounded.smt2
