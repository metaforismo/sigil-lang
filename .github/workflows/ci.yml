name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DSIGIL_ENABLE_GCCJIT=OFF -DSIGIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke check example
        run: ./build/sigil check examples/cache.sigil --no-z3 --dump-smt

  solver:
    name: Z3 strict proof smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3

      - name: Configure
        run: cmake -S . -B build -DSIGIL_ENABLE_GCCJIT=OFF -DSIGIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Strict proof smoke
        run: |
          ./build/sigil check examples/cache.sigil --strict
          ./build/sigil check examples/locals.sigil --strict
          ./build/sigil check examples/conditionals.sigil --strict
          ./build/sigil check examples/branches.sigil --strict
          ./build/sigil check examples/assignments.sigil --strict
          ./build/sigil check examples/native.sigil --strict
          ./build/sigil check examples/loops.sigil --strict

      - name: Refutation smoke
        run: |
          set +e
          output="$(./build/sigil check examples/refuted.sigil --strict --show-model 2>&1)"
          status="$?"
          set -e
          echo "$output"
          test "$status" -eq 2
          grep "\\[REFUTED\\]" <<<"$output"
          grep "model:" <<<"$output"

      - name: SMT artifact smoke
        run: |
          ./build/sigil check examples/cache.sigil --strict --solver-timeout-ms 250 --save-smt build/smt
          test -f build/smt/fn.preserve_capacity.ensures.1.still_bounded.smt2
          grep "(set-option :timeout 250)" build/smt/fn.preserve_capacity.ensures.1.still_bounded.smt2

  native-backend:
    name: GCCJIT native lowering smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libgccjit
        run: |
          sudo apt-get update
          package="$(apt-cache search '^libgccjit-[0-9]+-dev$' | awk '{print $1}' | sort -V | tail -n1)"
          test -n "$package"
          sudo apt-get install -y "$package"

      - name: Configure
        run: cmake -S . -B build -DSIGIL_ENABLE_GCCJIT=ON -DSIGIL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Native compile smoke
        run: ./build/sigil compile examples/native.sigil

      - name: Native ABI run smoke
        run: |
          ./build/sigil run examples/native.sigil add_one 41 | grep "result: 42"

      - name: Native IR artifact smoke
        run: |
          ./build/sigil compile examples/native.sigil --save-native-ir build/native-ir
          test -f build/native-ir/fn.add_one.native-ir.txt
          grep "signature add_one(x: i64) -> i64" build/native-ir/fn.add_one.native-ir.txt
          grep "debug-info enabled" build/native-ir/fn.add_one.native-ir.txt
          grep "statement.assign.y" build/native-ir/fn.add_one.native-ir.txt
